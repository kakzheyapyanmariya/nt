body *{image-rendering:auto}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding:20px;min-height:100vh}
.glass{
  background:var(--glass);
  backdrop-filter:blur(14px) saturate(140%);
  -webkit-backdrop-filter:blur(14px) saturate(140%);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:0 8px 32px rgba(8,4,24,.35),inset 0 1px 0 rgba(255,255,255,.12);
}

/* center */
.main{display:flex;flex-direction:column;gap:20px;min-width:0}
.head{padding:18px 22px}
.hi{font-weight:700;font-size:14px;color:var(--muted)}
.clock{font-weight:700;font-size:56px;line-height:1.1;margin:6px 0}
.clock i{font-style:normal;color:var(--accent);padding:0 .12em}
.date{font-weight:700;font-size:15px;color:var(--muted)}
.search{display:flex;align-items:center;gap:10px;padding:12px 16px}
.search input{flex:1;background:none;border:0;outline:0;font-size:15px}
.search input::placeholder{color:var(--muted)}
.search i{color:var(--muted)}
.groups{display:flex;flex-direction:column;align-items:flex-start;gap:16px}
.grp{padding:14px 18px 16px;max-width:100%}
.grp.hide{display:none}
.grp h2{margin:0 0 12px;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.tiles{display:flex;flex-wrap:wrap;gap:10px}
.tile{width:100px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:8px;padding:12px 6px 10px;border-radius:14px;background:var(--glass2);border:1px solid transparent;transition:.15s;min-height:84px;text-align:center}
.tile:hover{border-color:var(--line);background:rgba(255,255,255,.13);transform:translateY(-2px)}
.tile.hide{display:none}
.ico{display:grid;place-items:center;height:34px;font-size:26px;color:var(--accent)}
.ico img{width:32px;height:32px;object-fit:contain}
.ltr{font-weight:700;font-size:20px}
.nm{font-size:12px;line-height:1.25;word-break:break-word}

/* right panel */
.right{position:sticky;top:20px;align-self:start;height:calc(100vh - 40px);display:flex;flex-direction:column;padding:14px;gap:12px;min-height:0}
.tabs{display:flex;gap:6px;padding:4px;background:var(--glass2);border-radius:12px}
.tabs button{flex:1;padding:8px;border:0;border-radius:9px;background:none;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.tabs button.on{background:rgba(255,255,255,.16);color:var(--text)}
.pane{display:none;flex-direction:column;gap:12px;min-height:0;flex:1}
.pane.on{display:flex}
form.add{display:grid;gap:8px}
.add input,.add textarea,.add select,.notes textarea{width:100%;background:var(--glass2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0;font-size:13px;color-scheme:dark}
.add input:focus,.add textarea:focus,.add select:focus,.notes textarea:focus{border-color:var(--accent)}
.add textarea{resize:vertical;min-height:54px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns{display:flex;gap:8px}
.btn{flex:1;padding:9px 12px;border:0;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;background:var(--accent);color:#2a1a45;transition:.15s}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--glass2);color:var(--text);border:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.bar .sp{flex:1}
.pill{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:12px;color:var(--muted)}
.pill.on{background:rgba(255,255,255,.16);color:var(--text)}
.bar select{background:var(--glass2);border:1px solid var(--line);border-radius:999px;padding:4px 8px;font-size:12px;color-scheme:dark;outline:0}
ul.list{list-style:none;margin:0;padding:0 2px 0 0;display:flex;flex-direction:column;gap:8px;overflow:auto;flex:1;min-height:0}
.empty{color:var(--muted);font-size:13px;padding:14px 4px;text-align:center}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:10px 10px 10px 12px;border-radius:12px;background:var(--glass2);border-left:3px solid var(--low)}
.task.p3{border-left-color:var(--high)}
.task.p2{border-left-color:var(--mid)}
.task.p1{border-left-color:var(--low)}
.task.done{opacity:.55}
.task.done .tt{text-decoration:line-through}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--muted);background:none;cursor:pointer;display:grid;place-items:center;font-size:11px;color:transparent;margin-top:1px}
.task.done .chk{background:var(--accent);border-color:var(--accent);color:#2a1a45}
.tt{font-size:14px;font-weight:700;word-break:break-word}
.td{font-size:12px;color:var(--muted);margin-top:4px;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.td.open{-webkit-line-clamp:unset;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.1);color:var(--muted)}
.p3 .chip.pr{color:var(--high)}
.p2 .chip.pr{color:var(--mid)}
.p1 .chip.pr{color:var(--low)}
.chip.soon{color:var(--mid);background:rgba(255,196,107,.14)}
.chip.over{color:var(--high);background:rgba(255,122,138,.16)}
.act{display:flex;flex-direction:column;gap:4px}
.act button{width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--muted);cursor:pointer;font-size:12px}
.act button:hover{background:rgba(255,255,255,.12);color:var(--text)}
.notes{flex:1;display:flex;min-height:0}
.notes textarea{flex:1;resize:none;font-size:13px;line-height:1.5}
.foot{display:flex;gap:6px;flex-wrap:wrap;padding-top:10px;border-top:1px solid var(--line)}
.foot button{flex:1;padding:8px 6px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);cursor:pointer;font-size:12px}
.foot button:hover{background:rgba(255,255,255,.14)}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:6px}

@media(max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr)}
  .right{grid-column:1/-1;position:static;height:auto;max-height:80vh}
}
@media(max-width:700px){
  .app{grid-template-columns:1fr;padding:12px}
  .clock{font-size:40px}
}
</style>
</head>
<body>
<div class="app">
  <main class="main">
    <header class="head glass">
      <div class="hi">Salam, Bogdan</div>
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
    </header>
    <div class="search glass">
      <i class="fas fa-search"></i>
      <input id="q" type="text" placeholder="Search Google" autocomplete="off" autofocus>
    </div>
    <div class="groups" id="groups"></div>
  </main>

  <aside class="right glass">
    <div class="tabs">
      <button class="on" data-tab="tasks">Задачи</button>
      <button data-tab="notes">Заметки</button>
    </div>

    <section class="pane on" id="pane-tasks">
      <form class="add" id="f" autocomplete="off">
        <input name="title" placeholder="Новая задача" maxlength="160">
        <textarea name="desc" placeholder="Описание (необязательно)" maxlength="1000"></textarea>
        <div class="row2">
          <input name="due" type="datetime-local" title="Дедлайн">
          <select name="prio" title="Важность">
            <option value="1">Низкая</option>
            <option value="2" selected>Средняя</option>
            <option value="3">Высокая</option>
          </select>
        </div>
        <div class="btns">
          <button class="btn" type="submit" id="submit">Добавить</button>
          <button class="btn ghost" type="button" id="cancel" hidden>Отмена</button>
        </div>
      </form>

      <div class="bar">
        <button class="pill on" data-f="all">Все</button>
        <button class="pill" data-f="active">Активные</button>
        <button class="pill" data-f="done">Готово</button>
        <span class="sp"></span>
        <select id="sort" title="Сортировка">
          <option value="due">по дедлайну</option>
          <option value="prio">по важности</option>
        </select>
      </div>
      <ul class="list" id="list"></ul>
      <div class="bar"><span id="count"></span></div>
    </section>

    <section class="pane" id="pane-notes">
      <div class="notes"><textarea id="notes" placeholder="Заметки..."></textarea></div>
    </section>

    <div class="foot">
      <button id="exp"><i class="fas fa-download"></i> Экспорт</button>
      <button id="imp"><i class="fas fa-upload"></i> Импорт</button>
      <button id="clr"><i class="fas fa-broom"></i> Убрать готовые</button>
      <input type="file" id="file" accept="application/json" hidden>
    </div>
  </aside>
</div>

<script>
const GROUPS=[{"name": "Study", "items": [{"name": "E-Learn", "url": "https://elearn.urfu.ru/", "type": "icon", "icon": {"name": "chalkboard-teacher", "prefix": "fas", "label": "Chalkboard Teacher"}}, {"name": "Т-Банк", "url": "https://edu.tbank.ru/", "type": "icon", "icon": {"name": "university", "prefix": "fas", "label": "Bank"}}, {"name": "NeetCode", "url": "https://neetcode.io/roadmap", "type": "icon", "icon": {"name": "laptop-code", "prefix": "fas", "label": "Laptop Code"}}, {"name": "SQL", "url": "https://sql-academy.org/ru/trainer", "type": "icon", "icon": {"name": "database", "prefix": "fas", "label": "Database"}}, {"name": "ЛК УрФУ", "url": "https://istudent.urfu.ru/", "type": "icon", "icon": {"name": "graduation-cap", "prefix": "fas", "label": "University"}}, {"name": "Solvit Task", "url": "https://solvit.space/coding/3212", "type": "icon", "icon": {"name": "code", "prefix": "fas", "label": "Code"}}, {"name": "LeetCode", "url": "https://leetcode.com/", "type": "image", "image": "https://leetcode.com/static/images/LeetCode_logo_rvs.png"}, {"name": "GitHub", "url": "https://github.com/", "type": "icon", "icon": {"name": "github", "prefix": "fab", "label": "GitHub"}}, {"name": "3X-UI", "url": "https://nargothrond.skiftare.dev:2053/cc0bdc0c61642677c66973415e7684e1/panel/", "type": "icon", "icon": {"name": "server", "prefix": "fas", "label": "Server"}}, {"name": "Vdsina", "url": "https://cp.vdsina.com/vds/view/1083166", "type": "icon", "icon": {"name": "beer", "prefix": "fas", "label": "beer"}}, {"name": "NSUCRYPTO", "url": "https://nsucrypto.nsu.ru/", "type": "icon", "icon": {"name": "accessible-icon", "prefix": "fab", "label": "Accessible Icon"}}]}, {"name": "Main", "items": [{"name": "VK", "url": "https://vk.com/feed", "type": "icon", "icon": {"name": "vk", "prefix": "fab", "label": "VK"}}, {"name": "Instagram", "url": "https://www.instagram.com/", "type": "image", "image": "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/instagram.png"}, {"name": "YouTube", "url": "https://www.youtube.com/", "type": "image", "image": "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/youtube.png"}, {"name": "Twitch", "url": "https://www.twitch.tv/", "type": "image", "image": "https://cdn-icons-png.flaticon.com/512/5968/5968819.png"}, {"name": "Gmail", "url": "https://mail.google.com/", "type": "image", "image": "https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/gmail.png"}, {"name": "Genius", "url": "https://genius.com/", "type": "icon", "icon": {"name": "music", "prefix": "fas", "label": "Genius Lyrics"}}, {"name": "Переводчик", "url": "https://translate.google.com/?hl=ru&sl=en&tl=ru&op=translate", "type": "icon", "icon": {"name": "language", "prefix": "fas", "label": "Language"}}, {"name": "Reacts", "url": "https://streamreact.ru/", "type": "icon", "icon": {"name": "film", "prefix": "fas", "label": "Film"}}, {"name": "РЗТ", "url": "https://risazatvorchestvo.com/", "type": "icon", "icon": {"name": "feather", "prefix": "fas", "label": "Feather"}}, {"name": "YouGile", "url": "https://ru.yougile.com/team/087c3ef81492/OBBY-67#OBB-7", "type": "icon", "icon": {"name": "tasks", "prefix": "fas", "label": "Tasks"}}]}, {"name": "Ai Services", "items": [{"name": "ChatGPT", "url": "https://chatgpt.com/", "type": "image", "image": "https://img.icons8.com/?size=512&id=iGqse5s20iex&format=png"}, {"name": "Grok", "url": "https://grok.com/", "type": "image", "image": "https://images.seeklogo.com/logo-png/61/2/grok-logo-png_seeklogo-613403.png"}, {"name": "Gemini", "url": "https://gemini.google.com/", "type": "image", "image": "https://upload.wikimedia.org/wikipedia/commons/8/8a/Google_Gemini_logo.svg"}, {"name": "Claude", "url": "https://claude.ai/", "type": "icon", "icon": {"name": "robot", "prefix": "fas", "label": "AI Assistant"}}, {"name": "Презентации", "url": "https://gamma.app/", "type": "icon", "icon": {"name": "file-powerpoint", "prefix": "fas", "label": "Powerpoint File"}}, {"name": "Qwen", "url": "https://chat.qwen.ai/", "type": "image", "image": "https://cdn.jsdelivr.net/npm/@lobehub/icons-static-png@latest/light/qwen-color.png"}, {"name": "Baba is you", "url": "https://aistudio.google.com/apps/8f55dfc1-23c0-40b7-88e1-2efd21751d6c?showPreview=true&showAssistant=true", "type": "icon", "icon": {"name": "puzzle-piece", "prefix": "fas", "label": "Puzzle Piece"}}]}, {"name": "Clothes", "items": [{"name": "Mowalola", "url": "https://www.mowalola.com/", "type": "icon", "icon": {"name": "tshirt", "prefix": "fas", "label": "Clothing"}}, {"name": "Spin4Spin", "url": "https://spin4spin.com/", "type": "icon", "icon": {"name": "recycle", "prefix": "fas", "label": "Resale"}}, {"name": "ЯМ", "url": "https://market.yandex.ru/", "type": "icon", "icon": {"name": "shopping-cart", "prefix": "fas", "label": "Marketplace"}}, {"name": "ДОВ", "url": "https://dlyaobshegovreda.ru/", "type": "icon", "icon": {"name": "shopping-bag", "prefix": "fas", "label": "Merch"}}, {"name": "Yori Sport", "url": "https://yorisport.ru/", "type": "icon", "icon": {"name": "running", "prefix": "fas", "label": "Sportswear"}}, {"name": "GR Project", "url": "https://grailz-project.ru/", "type": "icon", "icon": {"name": "tag", "prefix": "fas", "label": "Streetwear"}}, {"name": ".Solutions", "url": "https://www.nobody.solutions/", "type": "icon", "icon": {"name": "cog", "prefix": "fas", "label": "Brand"}}, {"name": "AP", "url": "https://archangelparamedic.com/", "type": "icon", "icon": {"name": "theater-masks", "prefix": "fas", "label": "Merch"}}, {"name": "Ozon", "url": "https://www.ozon.ru/", "type": "icon", "icon": {"name": "box", "prefix": "fas", "label": "Marketplace"}}, {"name": "Wildberries", "url": "https://www.wildberries.ru/", "type": "icon", "icon": {"name": "shopping-basket", "prefix": "fas", "label": "Marketplace"}}, {"name": "Avito", "url": "https://www.avito.ru/", "type": "icon", "icon": {"name": "handshake", "prefix": "fas", "label": "Marketplace"}}]}];
const PR={1:'низкая',2:'средняя',3:'высокая'};
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const load=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function fallback(el){
  const s=document.createElement('span');
  s.className='ltr';s.textContent=el.dataset.l||'?';
  el.replaceWith(s);
}
function icon(b){
  if(b.type==='icon'&&b.icon&&b.icon.name)
    return `<i class="${esc(b.icon.prefix||'fas')} fa-${esc(b.icon.name)}"></i>`;
  if(b.type==='image'&&b.image)
    return `<img src="${esc(b.image)}" alt="" referrerpolicy="no-referrer" data-l="${esc(b.name.charAt(0))}" onerror="fallback(this)">`;
  return `<span class="ltr">${esc(b.letter||b.name.slice(0,2))}</span>`;
}

/* bookmarks */
const tile=b=>`<a class="tile" href="${esc(b.url)}" data-n="${esc(b.name.toLowerCase())}"><span class="ico">${icon(b)}</span><span class="nm">${esc(b.name)}</span></a>`;
$('#groups').innerHTML=GROUPS.map(g=>`<section class="grp glass"><h2>${esc(g.name)}</h2><div class="tiles">${g.items.map(tile).join('')}</div></section>`).join('');


const q=$('#q');
q.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const v=q.value.trim();if(!v)return;
  location.href='https://www.google.com/search?q='+encodeURIComponent(v);
});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();q.focus()}
});

/* clock */
const ord=n=>{const m=n%100;if(m>=11&&m<=13)return n+'th';return n+({1:'st',2:'nd',3:'rd'}[n%10]||'th')};
function tick(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  $('#clock').innerHTML=`${p(d.getHours())}<i>:</i>${p(d.getMinutes())}<i>:</i>${p(d.getSeconds())}`;
  $('#date').textContent=`${d.toLocaleDateString('en-US',{weekday:'long'})}, ${ord(d.getDate())} ${d.toLocaleDateString('en-US',{month:'long'})}`;
}
tick();setInterval(tick,1000);

/* tabs */
$$('.tabs button').forEach(b=>b.onclick=()=>{
  $$('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.pane').forEach(p=>p.classList.toggle('on',p.id==='pane-'+b.dataset.tab));
});

/* notes */
const notes=$('#notes');
notes.value=load('nt_notes','');
notes.addEventListener('input',()=>save('nt_notes',notes.value));

/* tasks */
let tasks=load('nt_tasks',[]);
let filter='all',sortBy=load('nt_sort','due'),editId=null;
const f=$('#f');
$('#sort').value=sortBy;

const persist=()=>save('nt_tasks',tasks);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function dueInfo(t){
  if(!t.due)return null;
  const d=new Date(t.due),diff=d-Date.now(),abs=Math.abs(diff);
  const h=Math.round(abs/36e5),days=Math.floor(abs/864e5);
  const fmt=d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
  let rel,cls='';
  if(diff<0){rel=days>=1?`просрочено на ${days} д`:`просрочено на ${Math.max(h,1)} ч`;cls='over'}
  else if(diff<864e5){rel=h<1?'меньше часа':`через ${h} ч`;cls='soon'}
  else rel=`через ${days} д`;
  if(t.done){rel='';cls=''}
  return {fmt,rel,cls};
}

function view(){
  const a=tasks.filter(t=>filter==='all'||(filter==='active'?!t.done:t.done));
  const dv=t=>t.due?new Date(t.due).getTime():Infinity;
  return a.sort((x,y)=>{
    if(x.done!==y.done)return x.done-y.done;
    if(sortBy==='prio'&&x.prio!==y.prio)return y.prio-x.prio;
    if(dv(x)!==dv(y))return dv(x)<dv(y)?-1:1;
    return y.prio-x.prio;
  });
}

function render(){
  const rows=view();
  $('#list').innerHTML=rows.length?rows.map(t=>{
    const di=dueInfo(t);
    return `<li class="task p${t.prio}${t.done?' done':''}" data-id="${t.id}">
      <button class="chk" data-a="toggle" title="Готово"><i class="fas fa-check"></i></button>
      <div class="tb">
        <div class="tt">${esc(t.title)}</div>
        ${t.desc?`<div class="td" data-a="more">${esc(t.desc)}</div>`:''}
        <div class="chips">
          <span class="chip pr">${PR[t.prio]}</span>
          ${di?`<span class="chip ${di.cls}">${di.fmt}${di.rel?' · '+di.rel:''}</span>`:''}
        </div>
      </div>
      <div class="act">
        <button data-a="edit" title="Править"><i class="fas fa-pen"></i></button>
        <button data-a="del" title="Удалить"><i class="fas fa-trash"></i></button>
      </div>
    </li>`;
  }).join(''):'<li class="empty">Задач нет</li>';
  const left=tasks.filter(t=>!t.done).length;
  $('#count').textContent=`активных: ${left} · всего: ${tasks.length}`;
}

function resetForm(){
  editId=null;f.reset();f.prio.value='2';
  $('#submit').textContent='Добавить';
  $('#cancel').hidden=true;
}

f.addEventListener('submit',e=>{
  e.preventDefault();
  const title=f.title.value.trim();
  if(!title){f.title.focus();return}
  const data={title,desc:f.desc.value.trim(),due:f.due.value,prio:+f.prio.value};
  if(editId){const t=tasks.find(x=>x.id===editId);if(t)Object.assign(t,data)}
  else tasks.push({id:uid(),done:false,created:Date.now(),...data});
  resetForm();persist();render();
});
$('#cancel').onclick=resetForm;

$('#list').addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const li=e.target.closest('.task');if(!li)return;
  const t=tasks.find(x=>x.id===li.dataset.id);if(!t)return;
  const a=el.dataset.a;
  if(a==='more'){el.classList.toggle('open');return}
  if(a==='toggle'){t.done=!t.done}
  if(a==='del'){tasks=tasks.filter(x=>x.id!==t.id);if(editId===t.id)resetForm()}
  if(a==='edit'){
    editId=t.id;
    f.title.value=t.title;f.desc.value=t.desc||'';f.due.value=t.due||'';f.prio.value=t.prio;
    $('#submit').textContent='Сохранить';$('#cancel').hidden=false;f.title.focus();
    return;
  }
  persist();render();
});

$$('.bar .pill').forEach(b=>b.onclick=()=>{
  filter=b.dataset.f;
  $$('.bar .pill').forEach(x=>x.classList.toggle('on',x===b));
  render();
});
$('#sort').onchange=e=>{sortBy=e.target.value;save('nt_sort',sortBy);render()};

$('#clr').onclick=()=>{
  if(!tasks.some(t=>t.done))return;
  tasks=tasks.filter(t=>!t.done);persist();render();
};
$('#exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({tasks,notes:notes.value},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='tasks-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(a.href);
};
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{
  const file=e.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(Array.isArray(d.tasks)){tasks=d.tasks;persist()}
      if(typeof d.notes==='string'){notes.value=d.notes;save('nt_notes',d.notes)}
      render();
    }catch(err){alert('не удалось прочитать файл')}
  };
  r.readAsText(file);e.target.value='';
};

render();
setInterval(render,60000);
</script>
</body>
</html>
